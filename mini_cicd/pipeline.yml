# =============================================================================
# pipeline.yml
# Declarative configuration for the Mini CI/CD Pipeline.
# The orchestrator (orchestrator.py) is 100% project-agnostic: it only knows
# how to read this file and execute shell commands. All project-specific
# knowledge (paths, commands, image names) lives here.
# =============================================================================

project:
  name: "elevator-marl"
  # Absolute or relative (to this file) path to the target git repository.
  # mini_cicd lives inside the Elevator_MARL repo itself, so the repo root is one level up.
  repo_path: ".."
  # Branch the commit watcher polls for new commits.
  branch: "main"

# Where the watcher stores the last-seen commit SHA (for polling state).
watcher:
  poll_interval_seconds: 10
  state_file: "state/watcher_state.json"

# Global settings for build history / logging.
history:
  db_path: "history/build_history.db"
  logs_dir: "logs"

# Each stage runs sequentially, in a clean git-worktree checkout of the
# target repo, in the order declared below. `working_dir` is relative to
# the root of that isolated checkout. If a stage fails and
# `continue_on_failure` is not true, all subsequent stages are skipped.
stages:
  - name: build
    description: "Install project dependencies into the isolated checkout."
    working_dir: "."
    command: >
      python -m pip install --upgrade pip &&
      python -m pip install -r requirements.txt &&
      python -m pip install -r mini_cicd/requirements.txt &&
      python -m pip install pytest flake8 coverage
    continue_on_failure: false
    timeout_seconds: 900

  - name: unit_tests
    description: "Run the Elevator MARL and Mini CI/CD pytest suites."
    working_dir: "."
    command: "python -m pytest test_sim.py mini_cicd/test_dashboard.py -v --junitxml=pytest-report.xml"
    continue_on_failure: false
    timeout_seconds: 600

  - name: lint
    description: "Static analysis with flake8 over the MARL codebase."
    working_dir: "."
    command: "python -m flake8 --max-line-length=120 --exit-zero --output-file=flake8-report.txt ."
    continue_on_failure: true
    timeout_seconds: 300

  - name: coverage
    description: "Generate a coverage.py report for the application and CI dashboard tests."
    working_dir: "."
    command: >
      python -m coverage run --source=. -m pytest test_sim.py mini_cicd/test_dashboard.py &&
      python -m coverage report -m &&
      python -m coverage html -d coverage_html
    continue_on_failure: false
    timeout_seconds: 600

  - name: docker_build
    description: "Build a Docker image of the Elevator MARL simulator tagged with the commit SHA."
    type: docker
    working_dir: "."
    dockerfile: "Dockerfile"
    image_name: "elevator-marl"
    continue_on_failure: false
    timeout_seconds: 1200
